<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Freshly mowed front lawn</title>
  <desc id="desc">A clean residential front lawn with mower stripes, shrubs, a walkway, and warm sunlight.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dff0f2"/>
      <stop offset=".58" stop-color="#f6efe1"/>
      <stop offset="1" stop-color="#f1c57d"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#65a656"/>
      <stop offset=".5" stop-color="#2f7a43"/>
      <stop offset="1" stop-color="#185433"/>
    </linearGradient>
    <pattern id="stripe" width="84" height="84" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <rect width="42" height="84" fill="rgba(255,255,255,.12)"/>
      <rect x="42" width="42" height="84" fill="rgba(0,0,0,.07)"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#19331f" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="960" height="720" rx="42" fill="url(#sky)"/>
  <circle cx="782" cy="118" r="78" fill="#f7c76e" opacity=".75"/>
